<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3157d5">
  <meta name="description" content="A bilingual, timed pose-number cognitive trainer.">
  <script>
    if (!/Android/i.test(navigator.userAgent)) {
      const manifest = document.createElement("link");
      manifest.rel = "manifest";
      manifest.href = "manifest.webmanifest";
      document.head.appendChild(manifest);
    }
  </script>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.0.3">
  <title>Pose Cognitive Trainer</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Pose Cognitive Trainer home">
        <span class="brand-icon" aria-hidden="true">◆</span>
        <span class="brand-name">Pose Cognitive Trainer</span>
        <span class="app-version">V1.0.3</span>
      </a>
      <div class="header-actions">
        <button id="installButton" class="quiet-button" type="button" data-i18n="install">Install</button>
        <div class="language-picker" role="group" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="he" aria-pressed="false">עב</button>
        </div>
      </div>
    </header>

    <main>
      <section id="setupView" class="view setup-view">
        <div class="intro">
          <p class="eyebrow" data-i18n="readyLabel">READY</p>
          <h1 data-i18n="setupTitle">Set up your session</h1>
          <p data-i18n="setupSubtitle">Choose your pace, then get ready to move.</p>
        </div>

        <form id="settingsForm" novalidate>
          <div class="setting-grid">
            <label class="setting-card" for="poseCount">
              <span data-i18n="numberOfPoses">Number of poses</span>
              <span class="input-line"><input id="poseCount" name="poseCount" type="number" min="1" max="10" value="4" inputmode="numeric" required><small>1–10</small></span>
            </label>
            <label class="setting-card" for="totalTime">
              <span data-i18n="totalTime">Total time</span>
              <span class="input-line"><input id="totalTime" name="totalTime" type="number" min="1" max="240" value="120" inputmode="numeric" required><small data-i18n="seconds">seconds</small></span>
            </label>
            <label class="setting-card" for="poseInterval">
              <span data-i18n="poseInterval">Time between poses</span>
              <span class="input-line"><input id="poseInterval" name="poseInterval" type="number" min="1" max="20" value="5" inputmode="numeric" required><small data-i18n="seconds">seconds</small></span>
            </label>
          </div>

          <label class="switch-card" for="switchEnabled">
            <span><strong data-i18n="switchPosition">Switch position</strong><small data-i18n="switchHelp">Announce after every complete set</small></span>
            <input id="switchEnabled" name="switchEnabled" type="checkbox" role="switch" checked>
          </label>

          <p id="formError" class="form-error" role="alert" hidden></p>
          <button id="startButton" class="primary-button start-control" type="submit"><span aria-hidden="true">▶</span><span data-i18n="start">Start session</span></button>
        </form>
      </section>

      <section id="sessionView" class="view session-view" hidden aria-live="polite">
        <div id="statusBadge" class="status-badge" data-state="preparing" data-i18n="preparing">Preparing</div>
        <p id="instruction" class="instruction" data-i18n="getReady">Get ready</p>
        <div id="mainDisplay" class="main-display tabular">5</div>
        <div class="session-facts">
          <div><span data-i18n="timeRemaining">Time remaining</span><strong id="timeRemaining" class="tabular">02:00</strong></div>
          <div><span data-i18n="currentSet">Current set</span><strong id="setProgress" class="tabular">0 / 4</strong></div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressBar"></span></div>
        <div class="session-actions">
          <button id="pauseButton" class="secondary-button pause-control" type="button"><span class="control-icon pause-icon" aria-hidden="true"></span><span class="action-label" data-i18n="pause">Pause</span></button>
          <button id="stopButton" class="danger-button stop-control" type="button"><span aria-hidden="true">■</span><span data-i18n="stop">Stop</span></button>
        </div>
      </section>

      <section id="finishedView" class="view finished-view" hidden aria-live="assertive">
        <div class="finish-symbol" aria-hidden="true">✓</div>
        <h1 data-i18n="finished">Finished</h1>
        <p data-i18n="finishedHelp">Session complete. Well done.</p>
        <button id="newSessionButton" class="primary-button" type="button" data-i18n="newSession">New session</button>
      </section>
    </main>
  </div>

  <dialog id="installDialog" class="install-dialog">
    <form method="dialog">
      <h2 data-i18n="installTitle">Install the app</h2>
      <p id="installInstructions"></p>
      <div class="dialog-actions">
        <button class="secondary-button" type="submit" value="close" data-i18n="close">Close</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=1.0.3"></script>
</body>
</html>
